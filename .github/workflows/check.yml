name: Check patches
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patches:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check series
        shell: bash
        run: diff <(ls patches | grep -vx series | sort) <(grep . patches/series | sort)
      - name: Generate source
        env:
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/generate
      - name: Test changed packages
        working-directory: source
        shell: bash
        run: |
          read -r _ base < ../upstream
          git diff --name-only "$base" HEAD -- '*.go' | xargs -r dirname | sort -u |
              sed 's|^|./|' | xargs -r ./tool/go run ./cmd/testwrapper -race
